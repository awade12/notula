# Notula production stack for Coolify (docker-compose.yaml is the default path).
# Local dev Postgres only: docker-compose.yml
#
# Coolify: create ONE resource → Docker Compose → point at this repo.
# Magic SERVICE_* vars auto-generate domains, URLs, and secrets on first deploy.
# Override domains in Coolify UI (e.g. notula.dev / api.notula.dev) when ready.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notula}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or deploy on Coolify}}
      POSTGRES_DB: ${POSTGRES_DB:-notula}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-notula} -d ${POSTGRES_DB:-notula}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
    restart: 'no'
    entrypoint: ['sh', '-c']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notula}:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-notula}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['cd /app/apps/server && bun run db:migrate && (bun run db:migrate:pgvector || true)']

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_SERVER_3001: ''
      DATABASE_URL: postgresql://${POSTGRES_USER:-notula}:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-notula}
      BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_AUTH:-${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET or deploy on Coolify}}
      BETTER_AUTH_URL: ${SERVICE_URL_SERVER:-${BETTER_AUTH_URL:?Set BETTER_AUTH_URL or deploy on Coolify}}
      WEB_ORIGIN: ${SERVICE_URL_WEB:-${WEB_ORIGIN:?Set WEB_ORIGIN or deploy on Coolify}}
      PORT: '3001'
      RUN_MIGRATIONS: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
        VITE_API_URL: ${SERVICE_URL_SERVER:-${VITE_API_URL:?Set VITE_API_URL or deploy on Coolify}}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEB_3000: ''
      PORT: '3000'
      HOST: 0.0.0.0
    depends_on:
      server:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
