# Notula production stack for Coolify (docker-compose.yaml is the default path).
# Local dev Postgres only: docker-compose.yml
#
# Coolify domains — set on EACH service in the compose UI (include internal port):
#   web    → https://notes.bluevistastudio.com:3000
#   server → https://api.bluevistastudio.com:3001
# The :3000 / :3001 suffix is required for Traefik routing (not shown in the browser URL).
# Optional override when web + API are on sibling subdomains:
#   AUTH_COOKIE_DOMAIN=.bluevistastudio.com
# Auto-detected from WEB_ORIGIN + BETTER_AUTH_URL when both share a parent domain.
#
# Coolify bug: SERVICE_URL_* may stay on the old sslip.io URL after you set custom
# domains. This stack prefers SERVICE_FQDN_* (correct) for runtime + web build.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notula}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or deploy on Coolify}}
      POSTGRES_DB: ${POSTGRES_DB:-notula}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-notula} -d ${POSTGRES_DB:-notula}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
    image: notula-server
    restart: 'no'
    entrypoint: ['/app/apps/server/docker-migrate.sh']
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-notula}
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${POSTGRES_DB:-notula}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
    image: notula-server
    restart: unless-stopped
    environment:
      SERVICE_FQDN_SERVER_3001: ${SERVICE_FQDN_SERVER_3001:-}
      SERVICE_FQDN_SERVER: ${SERVICE_FQDN_SERVER:-}
      SERVICE_URL_SERVER: ${SERVICE_URL_SERVER:-}
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000:-}
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB:-}
      SERVICE_URL_WEB: ${SERVICE_URL_WEB:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-notula}
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${POSTGRES_DB:-notula}
      BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_AUTH:-${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET or deploy on Coolify}}
      PORT: '3001'
      RUN_MIGRATIONS: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - '3001'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HUGEICONS_LICENSE_KEY: ${HUGEICONS_LICENSE_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
        SERVICE_FQDN_SERVER_3001: ${SERVICE_FQDN_SERVER_3001:-}
        SERVICE_FQDN_SERVER: ${SERVICE_FQDN_SERVER:-}
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://server:3001
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000:-}
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB:-}
      SERVICE_FQDN_SERVER_3001: ${SERVICE_FQDN_SERVER_3001:-}
      SERVICE_FQDN_SERVER: ${SERVICE_FQDN_SERVER:-}
      SERVICE_URL_SERVER: ${SERVICE_URL_SERVER:-}
      PORT: '3000'
      HOST: 0.0.0.0
    depends_on:
      server:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
